# ─────────────────────────────────────────────────────────────────────────────
#  jolokia-mappings.yml — métriques JVM et Tomcat de {{STUDENT_ID}}
#
#  À reporter dans l'intégration « Jolokia » de la politique qui pilote
#  l'agent de la machine où tourne Tomcat :
#    - Apache et Tomcat sur la MÊME VM (cas de ce manuel) : {{POLICY_HOTE}}
#    - Tomcat sur une VM dédiée                           : {{POLICY}}
#  Un agent n'appartient qu'à UNE politique : n'ajoutez pas ces mappings
#  des deux côtés.
#  L'agent Jolokia expose les MBeans en HTTP/JSON sur 127.0.0.1:{{JOLOKIA_PORT}}
#  (voir la ligne -javaagent de setenv.sh).
#
#  Les noms de champs cibles sont CHOISIS ICI : c'est vous qui décidez du
#  vocabulaire. Gardez-le stable, vos dashboards en dépendent.
#
#  À VÉRIFIER : les noms exacts des options de l'intégration Jolokia
#  (namespace, hosts, jmx.mappings) dépendent de la version installée.
#  Ouvrez l'intégration dans Fleet et comparez avant de coller.
# ─────────────────────────────────────────────────────────────────────────────
- namespace: "jvm"
  hosts: ["http://127.0.0.1:{{JOLOKIA_PORT}}/jolokia"]
  period: 10s
  jmx.mappings:
    - mbean: "java.lang:type=Memory"
      attributes:
        - { attr: "HeapMemoryUsage", field: "memory.heap" }
        - { attr: "NonHeapMemoryUsage", field: "memory.non_heap" }
    - mbean: "java.lang:name=*,type=GarbageCollector"
      attributes:
        - { attr: "CollectionCount", field: "gc.count" }
        - { attr: "CollectionTime", field: "gc.time_ms" }
    - mbean: "java.lang:type=Threading"
      attributes:
        - { attr: "ThreadCount", field: "threads.count" }
        - { attr: "PeakThreadCount", field: "threads.peak" }
    - mbean: "java.lang:type=OperatingSystem"
      attributes:
        - { attr: "ProcessCpuLoad", field: "cpu.process_load" }
    #  Jokers (name=*, context=*) : les noms exacts contiennent des guillemets
    #  ou des « / » que l'intégration ne fait pas correspondre de façon fiable.
    - mbean: "Catalina:name=*,type=ThreadPool"
      attributes:
        - { attr: "maxThreads", field: "tomcat.threads.max" }
        - { attr: "currentThreadsBusy", field: "tomcat.threads.busy" }
        - { attr: "connectionCount", field: "tomcat.connections" }
    - mbean: "Catalina:name=*,type=GlobalRequestProcessor"
      attributes:
        - { attr: "requestCount", field: "tomcat.requests.count" }
        - { attr: "errorCount", field: "tomcat.requests.errors" }
    - mbean: "Catalina:context=*,host=localhost,type=Manager"
      attributes:
        - { attr: "activeSessions", field: "tomcat.sessions.active" }
