# ─────────────────────────────────────────────────────────────────────────────
#  custom-logs-multiline.yml — {{STUDENT_ID}}
#
#  À coller dans le champ « Custom configurations » de l'entrée filestream
#  de l'intégration Custom Logs, dans Fleet.
#
#  OBJECTIF : qu'une exception Java de 40 lignes devienne UN document,
#  et non 40 documents inutilisables dont aucun ne contient l'erreur
#  complète. Sans ce traitement, le message est séparé de sa cause et
#  aucune recherche ne fonctionne.
# ─────────────────────────────────────────────────────────────────────────────
parsers:
  - multiline:
      type: pattern
      # Une nouvelle entrée de journal COMMENCE par une date « 06-Nov-2026 … ».
      # On reconnaît le DÉBUT d'un événement plutôt que les lignes de
      # continuation : c'est plus robuste, car cela ne dépend pas du style
      # d'indentation de la JVM.
      pattern: '^\d{2}-[A-Za-z]{3}-\d{4}\s\d{2}:\d{2}:\d{2}'
      # negate: true -> les lignes qui NE correspondent PAS au motif...
      negate: true
      # ...sont rattachées à l'événement précédent.
      match: after
      # Garde-fou : au-delà, l'événement est tronqué. Sans plafond, une pile
      # d'appels pathologique peut produire un document énorme.
      max_lines: 200
      # Ferme l'événement si plus rien n'arrive. Sans ce délai, la dernière
      # erreur avant un silence reste bloquée en attente et n'est jamais
      # indexée — exactement l'erreur que vous cherchiez.
      timeout: 5s

# Variante, si les lignes de continuation sont indentées et que le motif de
# date ne convient pas (par exemple pour un journal applicatif maison) :
#
# parsers:
#   - multiline:
#       type: pattern
#       pattern: '^[[:space:]]+(at|\.{3})|^Caused by:'
#       negate: false
#       match: after
