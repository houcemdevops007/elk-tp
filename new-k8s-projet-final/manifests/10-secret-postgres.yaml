# ─────────────────────────────────────────────────────────────────────────────
#  10-secret-postgres.yaml — identifiants de la base ({{STUDENT_ID}})
#
#  stringData permet d'écrire la valeur en clair DANS CE FICHIER, que
#  Kubernetes encodera. C'est pratique en TP, et c'est exactement ce qu'il
#  ne faut pas versionner : un Secret Kubernetes n'est pas chiffré, il est
#  seulement encodé en base64.
#
#  En production : SealedSecrets, External Secrets Operator, ou le
#  gestionnaire de secrets du fournisseur. Et chiffrement au repos activé
#  sur etcd.
#
#  Ne commitez JAMAIS ce fichier rempli.
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: v1
kind: Secret
metadata:
  name: shopflow-db
  namespace: "{{NAMESPACE}}"
  labels:
    app.kubernetes.io/part-of: shopflow
type: Opaque
stringData:
  POSTGRES_USER: "shopflow"
  POSTGRES_PASSWORD: "{{PG_PASSWORD}}"
  POSTGRES_DB: "shopflow"
