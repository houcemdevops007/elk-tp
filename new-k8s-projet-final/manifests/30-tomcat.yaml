# ─────────────────────────────────────────────────────────────────────────────
#  30-tomcat.yaml — deuxième tier : backend Tomcat ({{STUDENT_ID}})
#
#  Le WAR n'est pas dans une image : il est monté depuis un ConfigMap
#  construit par build-configmap-war.sh. Cela évite d'avoir à construire et
#  à publier une image dans un registre, ce qui n'est pas le sujet du TP.
#
#  La journalisation va sur la sortie standard (catalina.out du conteneur
#  officiel y écrit déjà) : le DaemonSet collecte, l'application ne sait
#  rien de la plateforme d'observabilité.
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: v1
kind: Service
metadata:
  name: shopflow-app
  namespace: "{{NAMESPACE}}"
  labels:
    app.kubernetes.io/name: shopflow-app
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: shopflow
spec:
  selector:
    app.kubernetes.io/name: shopflow-app
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: shopflow-app
  namespace: "{{NAMESPACE}}"
  labels:
    app.kubernetes.io/name: shopflow-app
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: shopflow
    app.kubernetes.io/version: "2.4.1"
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: shopflow-app
  template:
    metadata:
      labels:
        app.kubernetes.io/name: shopflow-app
        app.kubernetes.io/component: backend
        app.kubernetes.io/part-of: shopflow
        app.kubernetes.io/version: "2.4.1"
      annotations:
        co.elastic.logs/enabled: "true"
        # Les lignes JSON émises par l'application sont décodées ; les
        # lignes de démarrage de Tomcat, qui ne sont pas du JSON, restent
        # dans le champ message. add_error_key permet de les repérer.
        co.elastic.logs/json.keys_under_root: "true"
        co.elastic.logs/json.add_error_key: "true"
        co.elastic.logs/json.overwrite_keys: "true"
    spec:
      containers:
        - name: tomcat
          image: "tomcat:{{TOMCAT_IMAGE_TAG}}"
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: CATALINA_OPTS
              valueFrom:
                configMapKeyRef:
                  name: shopflow-app
                  key: JAVA_OPTS_EXTRA
            - name: DB_HOST
              valueFrom:
                configMapKeyRef:
                  name: shopflow-app
                  key: DB_HOST
            - name: DB_PORT
              valueFrom:
                configMapKeyRef:
                  name: shopflow-app
                  key: DB_PORT
            # Les identifiants viennent du SECRET, jamais du ConfigMap.
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: shopflow-db
                  key: POSTGRES_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: shopflow-db
                  key: POSTGRES_PASSWORD
          volumeMounts:
            # subPath : on monte UN fichier dans un répertoire qui reste
            # inscriptible, pour que Tomcat puisse déployer l'archive.
            - name: war
              mountPath: /usr/local/tomcat/webapps/{{APP_CONTEXT}}.war
              subPath: "{{APP_CONTEXT}}.war"
              readOnly: true
          resources:
            requests:
              cpu: 200m
              memory: 384Mi
            limits:
              # ATTENTION : la heap ({{HEAP_MB}} Mo) doit rester NETTEMENT
              # sous cette limite. -Xmx ne borne que la heap ; le conteneur
              # est tué sur la mémoire TOTALE du processus (heap + metaspace
              # + code cache + piles de threads). Viser 50 à 70 % de la limite.
              cpu: "1"
              memory: 768Mi
          startupProbe:
            # Tomcat met plusieurs dizaines de secondes à déployer : une
            # liveness probe seule le tuerait en boucle (chapitre 3, panne 3).
            httpGet:
              path: /{{APP_CONTEXT}}/health
              port: http
            periodSeconds: 5
            failureThreshold: 24
          readinessProbe:
            httpGet:
              path: /{{APP_CONTEXT}}/health
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /{{APP_CONTEXT}}/health
              port: http
            periodSeconds: 20
            failureThreshold: 3
      volumes:
        - name: war
          configMap:
            name: shopflow-war
