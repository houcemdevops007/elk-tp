# ─────────────────────────────────────────────────────────────────────────────
#  shopflow-vhost.conf — hôte virtuel ShopFlow
#  Candidat : student20   VM : vault (172.16.34.100)
#
#  Emplacement : /etc/apache2/sites-available/shopflow.conf
#  Activation  : sudo a2ensite shopflow && sudo a2dissite 000-default
#                sudo apachectl configtest && sudo systemctl reload apache2
#
#  Chapitre 1 : seules les ressources statiques et /health répondent.
#  Chapitre 2 : le bloc ProxyPass envoie /api/ vers Tomcat.
# ─────────────────────────────────────────────────────────────────────────────
<VirtualHost *:80>
    ServerName shopflow.efi-academy.local
    DocumentRoot /var/www/shopflow

    <Directory /var/www/shopflow>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    # Sonde de supervision : réponse locale, sans passer par le backend.
    # Elle est volontairement exclue des mesures de trafic réel (chapitre 1).
    Alias /health /var/www/shopflow/health.json
    <Files "health.json">
        Require all granted
    </Files>

    # Fichiers sensibles : refus explicite (produit les 403 du scénario « flood »).
    <FilesMatch "^\.(env|git)">
        Require all denied
    </FilesMatch>

    # ─── Chapitre 2 : reverse proxy vers Tomcat ───────────────────────────
    #  Activer les modules :  sudo a2enmod proxy proxy_http headers unique_id
    #  Puis décommenter les quatre lignes suivantes.
    # ProxyPreserveHost On
    # ProxyPass        /api/ http://127.0.0.1:8080/shopflow-api/api/
    # ProxyPassReverse /api/ http://127.0.0.1:8080/shopflow-api/api/
    # ProxyTimeout 30

    # La journalisation est définie dans conf-available/shopflow-logs.conf
    # (un seul endroit, pour toutes les vhosts).
</VirtualHost>
