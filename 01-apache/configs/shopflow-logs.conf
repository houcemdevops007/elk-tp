# ─────────────────────────────────────────────────────────────────────────────
#  shopflow-logs.conf — journalisation Apache pour ShopFlow (NovaCommerce)
#  Candidat : {{STUDENT_ID}}   VM : {{STUDENT_HOST}} ({{STUDENT_IP}})
#
#  Emplacement : /etc/apache2/conf-available/shopflow-logs.conf
#  Activation  : sudo a2enconf shopflow-logs
#                sudo apachectl configtest && sudo systemctl reload apache2
#
#  POURQUOI DEUX JOURNAUX
#   - access.log       : format « combined », celui que l'intégration Apache
#                        d'Elastic sait parser seule, sans configuration.
#   - access_json.log  : JSON portant %D (la DURÉE), que les formats standards
#                        ne contiennent pas. Sans ce journal, aucun percentile
#                        de latence n'est calculable côté Apache.
# ─────────────────────────────────────────────────────────────────────────────

# ─── Format 1 : combined standard ───────────────────────────────────────────
#  %h hôte distant   %l identd (toujours « - »)   %u utilisateur authentifié
#  %t date           %r première ligne de requête %>s statut final
#  %O octets envoyés, en-têtes compris (préférer %O ou %B à %b : %b écrit « - »
#     pour une réponse vide, ce qui casse les agrégations numériques)
LogFormat "%h %l %u %t \"%r\" %>s %O \"%{Referer}i\" \"%{User-Agent}i\"" shopflow_combined

# ─── Format 2 : JSON enrichi, noms de champs déjà en ECS ────────────────────
#  %D  durée de traitement en MICROSECONDES (Apache httpd)
#  %B  octets du corps, 0 si vide      %p port    %v vhost
#  %X  état de la connexion en fin de requête (X = client parti avant la fin)
LogFormat "{\
\"@timestamp\":\"%{%Y-%m-%dT%H:%M:%S}t.%{msec_frac}t%{%z}t\",\
\"source.address\":\"%a\",\
\"http.request.method\":\"%m\",\
\"url.original\":\"%U%q\",\
\"url.path\":\"%U\",\
\"http.version\":\"%H\",\
\"http.response.status_code\":%>s,\
\"http.response.body.bytes\":%B,\
\"http.request.referrer\":\"%{Referer}i\",\
\"user_agent.original\":\"%{User-Agent}i\",\
\"server.port\":%p,\
\"shopflow.vhost\":\"%v\",\
\"shopflow.student\":\"{{STUDENT_ID}}\",\
\"shopflow.duration_us\":%D,\
\"shopflow.conn_status\":\"%X\",\
\"shopflow.request_id\":\"%{UNIQUE_ID}e\"\
}" shopflow_json

# ─── Destinations ───────────────────────────────────────────────────────────
CustomLog {{APACHE_LOG_DIR}}/access.log      shopflow_combined
CustomLog {{APACHE_LOG_DIR}}/access_json.log shopflow_json

# ─── Journal d'erreurs ──────────────────────────────────────────────────────
#  « warn » est le bon réglage en régime normal. « info » et « debug »
#  produisent un volume considérable : à n'activer que le temps d'un diagnostic.
ErrorLog {{APACHE_LOG_DIR}}/error.log
LogLevel warn

# ─── Identifiant de corrélation transmis au backend (utile au chapitre 2) ───
#  mod_unique_id et mod_headers doivent être actifs :
#    sudo a2enmod unique_id headers
RequestHeader set X-Request-Id "%{UNIQUE_ID}e"
