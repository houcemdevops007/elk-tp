# ─────────────────────────────────────────────────────────────────────────────
#  server-status.conf — mod_status pour la collecte de métriques Apache
#  Candidat : {{STUDENT_ID}}   VM : {{STUDENT_HOST}} ({{STUDENT_IP}})
#
#  Emplacement : /etc/apache2/conf-available/server-status.conf
#  Activation  : sudo a2enmod status && sudo a2enconf server-status
#                sudo apachectl configtest && sudo systemctl reload apache2
#
#  Deux rendus :
#    /server-status        page HTML, pour un humain
#    /server-status?auto   texte brut, une métrique par ligne : c'est CE format
#                          que lit l'intégration Apache d'Elastic.
# ─────────────────────────────────────────────────────────────────────────────

# Compteurs détaillés (durées, octets, scoreboard complet).
# Depuis Apache 2.3.6 le chargement de mod_status l'active par défaut ;
# on le déclare malgré tout pour ne pas dépendre du paquet de la distribution.
ExtendedStatus On

<Location "/server-status">
    SetHandler server-status

    # ── LE point critique : contrôle d'accès ──
    # L'Elastic Agent tourne sur la machine : la boucle locale suffit.
    # /server-status exposé publiquement est une fuite d'information
    # (URL en cours de traitement, IP des clients, vhosts).
    Require local

    # Si l'agent interrogeait depuis une autre machine, on autoriserait
    # son adresse — et uniquement la sienne :
    # Require ip {{STUDENT_IP}}
</Location>
