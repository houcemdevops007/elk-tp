# ─────────────────────────────────────────────────────────────────────────────
#  20-elastic-agent-daemonset.yaml — collecte Kubernetes ({{STUDENT_ID}})
#
#  POURQUOI UN DAEMONSET : les fichiers de log des conteneurs vivent sur le
#  système de fichiers du NŒUD (/var/log/pods). Il faut donc un collecteur
#  par nœud, qui monte /var/log. C'est exactement la définition d'un
#  DaemonSet — un pod sur chaque nœud, y compris ceux ajoutés plus tard.
#
#  Cet agent est DISTINCT de celui installé sur l'hôte aux chapitres 1 et 2 :
#  il s'enrôle dans la politique {{POLICY_K8S}}, pas dans {{POLICY}}.
#
#  AVANT D'APPLIQUER, créez le secret contenant le token (jamais en clair
#  dans un manifeste, jamais dans Git) :
#    kubectl create namespace elastic-agent
#    kubectl -n elastic-agent create secret generic elastic-agent-creds \
#      --from-literal=enrollment-token='<votre-token-k8s>'
#    kubectl -n elastic-agent create secret generic elastic-agent-ca \
#      --from-file=ca.crt={{CA_PATH}}
#
#  La référence reste le manifeste généré par VOTRE Kibana
#  (Fleet -> Agents -> Add agent -> Kubernetes) : il correspond à la version
#  de la stack. Ce fichier en est la version commentée.
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: v1
kind: ServiceAccount
metadata:
  name: elastic-agent
  namespace: elastic-agent
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: elastic-agent
rules:
  # L'agent interroge l'API Kubernetes pour ENRICHIR chaque ligne de log
  # avec le namespace, le pod, le conteneur, le nœud et les labels.
  # Sans ces droits : des logs sans nom de pod, donc inexploitables.
  - apiGroups: [""]
    resources: [nodes, namespaces, events, pods, services, configmaps,
                serviceaccounts, persistentvolumes, persistentvolumeclaims]
    verbs: ["get", "watch", "list"]
  - apiGroups: ["apps"]
    resources: [replicasets, deployments, daemonsets, statefulsets]
    verbs: ["get", "watch", "list"]
  - apiGroups: ["batch"]
    resources: [jobs, cronjobs]
    verbs: ["get", "watch", "list"]
  - apiGroups: [""]
    resources: [nodes/stats, nodes/metrics, nodes/proxy]
    verbs: ["get"]
  - nonResourceURLs: ["/metrics"]
    verbs: ["get"]
  - apiGroups: ["coordination.k8s.io"]
    resources: [leases]
    verbs: ["get", "create", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: elastic-agent
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: elastic-agent
subjects:
  - kind: ServiceAccount
    name: elastic-agent
    namespace: elastic-agent
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: elastic-agent
  namespace: elastic-agent
  labels:
    app.kubernetes.io/name: elastic-agent
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: elastic-agent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: elastic-agent
    spec:
      serviceAccountName: elastic-agent
      # hostNetwork : nécessaire pour joindre le kubelet du nœud.
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      tolerations:
        # Sur k3s mono-nœud, le nœud porte le control plane : sans cette
        # tolérance, AUCUN agent ne serait ordonnancé et vous chercheriez
        # longtemps pourquoi rien n'est collecté.
        - key: node-role.kubernetes.io/control-plane
          effect: NoSchedule
          operator: Exists
        - key: node-role.kubernetes.io/master
          effect: NoSchedule
          operator: Exists
      containers:
        - name: elastic-agent
          image: "docker.elastic.co/beats/elastic-agent:{{ES_VERSION}}"
          env:
            - name: FLEET_ENROLL
              value: "1"
            - name: FLEET_URL
              value: "{{FLEET_URL}}"
            - name: FLEET_ENROLLMENT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: elastic-agent-creds
                  key: enrollment-token
            - name: FLEET_CA
              value: /etc/efi-ca/ca.crt
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          securityContext:
            # L'agent lit /var/log et le cgroupfs du nœud : il lui faut root.
            # En revanche il ne monte RIEN en écriture.
            runAsUser: 0
          resources:
            # Un collecteur non borné peut provoquer l'éviction de pods
            # applicatifs : l'outil d'observation devient alors la cause de
            # l'incident. On le borne, toujours.
            requests:
              cpu: 100m
              memory: 200Mi
            limits:
              cpu: 500m
              memory: 600Mi
          volumeMounts:
            - name: varlog
              mountPath: /var/log
              readOnly: true
            - name: varlibdockercontainers
              mountPath: /var/lib/docker/containers
              readOnly: true
            - name: proc
              mountPath: /hostfs/proc
              readOnly: true
            - name: cgroup
              mountPath: /hostfs/sys/fs/cgroup
              readOnly: true
            - name: efi-ca
              mountPath: /etc/efi-ca
              readOnly: true
      volumes:
        - name: varlog
          hostPath:
            path: /var/log
        - name: varlibdockercontainers
          hostPath:
            path: /var/lib/docker/containers
        - name: proc
          hostPath:
            path: /proc
        - name: cgroup
          hostPath:
            path: /sys/fs/cgroup
        - name: efi-ca
          secret:
            secretName: elastic-agent-ca
